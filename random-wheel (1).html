<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tatsin duang chata · วงล้อสุ่ม</title>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#b9d6c1;font-family:'Mali','Noto Sans Thai',sans-serif}
#stage{position:absolute;left:50%;top:50%;width:1440px;height:1024px;transform-origin:0 0;overflow:hidden;background:linear-gradient(#bfe0c8,#e8b7c8)}
.pos{position:absolute;pointer-events:none;animation:var(--fl) var(--fd,6s) var(--fdl,1.5s) ease-in-out infinite alternate}
.pos>img{display:block;width:100%;height:100%;animation:var(--in,fade) 1.1s var(--d,0s) both cubic-bezier(.2,.8,.2,1)}
@keyframes fade{from{opacity:0}}@keyframes show{to{opacity:1}}
@keyframes zoom{from{opacity:0;transform:scale(1.25)}}
@keyframes up{from{opacity:0;transform:translateY(60px)}}
@keyframes drop{from{opacity:0;transform:translateY(-60px)}}
@keyframes left{from{opacity:0;transform:translateX(-90px)}}
@keyframes right{from{opacity:0;transform:translateX(90px)}}
@keyframes pop{from{opacity:0;transform:scale(.4) rotate(-8deg)}}
@keyframes spinin{from{opacity:0;transform:rotate(-220deg) scale(.3)}}
@keyframes fl1{to{transform:translateY(-10px)}}
@keyframes fl2{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
@keyframes fl3{to{transform:scale(1.045)}}
@keyframes sway{from{transform:rotate(-1.6deg)}to{transform:rotate(1.6deg)}}
@keyframes glow{from{filter:drop-shadow(0 0 2px #ff9cf0)}to{filter:drop-shadow(0 0 14px #ff6fe0)}}
/* wheel */
#wheel{position:absolute;pointer-events:auto;z-index:13}
#wheel{animation:spinin 1.8s 1s both cubic-bezier(.2,.8,.2,1)}
#disc{position:absolute;inset:0;transform-origin:335px 312px;transition:transform 5.5s cubic-bezier(.12,.65,.08,1)}
#disc svg{position:absolute;inset:0}
#wheel>#ring{position:absolute;inset:0;animation:none;
 -webkit-mask-image:radial-gradient(circle at 335px 312px,#000 71px,transparent 72px,transparent 194px,#000 195px);
 mask-image:radial-gradient(circle at 335px 312px,#000 71px,transparent 72px,transparent 194px,#000 195px)}
#hit{position:absolute;left:265px;top:242px;width:140px;height:140px;border-radius:50%;cursor:pointer}
#hit:hover{box-shadow:0 0 30px 8px #fff8}
/* list on paper */
#paper{position:absolute;left:962px;top:468px;width:362px;height:236px;z-index:30;opacity:0;animation:show .8s 1.9s forwards}
#list{height:100%;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#d9a3b5 transparent}
.row{display:flex;align-items:center;height:32px;color:#5b4a3c}
.row b{width:30px;font-weight:600;font-size:17px;opacity:.7}
.row input{flex:1;min-width:0;background:transparent;border:0;border-bottom:1px dashed #c9b7a3;outline:0;font:inherit;font-size:19px;color:#4a3a2c;padding:2px 4px}
.row input:focus{border-bottom-color:#e26fb0;background:#fff4}
.row input::placeholder{color:#b9a791;font-size:15px}
.row{animation:rowin .35s both}@keyframes rowin{from{opacity:0;transform:translateX(-14px)}}
#go{position:absolute;left:1075px;top:716px;width:170px;height:46px;z-index:30;border:0;border-radius:30px;cursor:pointer;
 font:600 20px 'Mali',sans-serif;color:#fff;background:linear-gradient(135deg,#ff8fd0,#b98cff);box-shadow:0 4px 16px #b0408a66,inset 0 0 0 2px #fff7;
 opacity:0;animation:show .8s 2.2s forwards,pulse 2.4s 3s ease-in-out infinite}
#go:hover{filter:brightness(1.1)}#go:disabled{filter:grayscale(.6);cursor:wait}
@keyframes pulse{50%{transform:scale(1.06)}}
#eye{position:absolute;left:978px;top:716px;width:58px;height:42px;z-index:31;cursor:pointer;border-radius:12px;opacity:0;animation:show .6s 2.2s forwards}
#eye:hover{background:#fff5}
#eye::after{content:'';position:absolute;left:8px;right:8px;top:19px;height:3px;border-radius:2px;background:#b0408a;transform:rotate(-30deg) scaleX(0);transition:transform .25s}
.hide #eye::after{transform:rotate(-30deg) scaleX(1)}
#list{transition:filter .3s,opacity .3s}.hide #list{filter:blur(9px);opacity:.55}
#slices text{transition:opacity .3s}.hide #slices text{opacity:0}
#mute{position:absolute;left:1380px;top:12px;z-index:40;width:44px;height:44px;border:0;border-radius:50%;background:#fff8;font-size:22px;cursor:pointer}
#toast{position:absolute;left:50%;top:90px;transform:translateX(-50%);z-index:60;background:#fffc;border-radius:20px;padding:8px 20px;color:#a0407a;font-size:20px;opacity:0;transition:.3s;pointer-events:none}
#win{position:absolute;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:#fff4;backdrop-filter:blur(4px);cursor:pointer}
#win div{background:linear-gradient(#fff,#ffe6f4);border:3px solid #fff;border-radius:40px;padding:34px 70px;text-align:center;box-shadow:0 10px 50px #b0408a88;animation:pop .6s both cubic-bezier(.2,1.4,.4,1)}
#win small{display:block;color:#a06aa8;font-size:24px}
#win strong{display:block;margin-top:8px;font-size:68px;color:#e0409a;text-shadow:0 0 18px #ff9ce0;max-width:900px;word-break:break-word}
@media (prefers-reduced-motion:reduce){.pos,.pos>img{animation:none!important}#disc{transition-duration:1s}}
</style></head><body>
<div id="stage">
 <div id="wheel">
  <div id="disc"><svg viewBox="0 0 672 664" width="672" height="664"><g id="slices" transform="translate(335 312)"></g></svg></div>
  <div id="hit" title="กดเพื่อหมุน"></div>
 </div>
 <div id="paper"><div id="list"></div></div>
 <div id="eye" title="ซ่อน/แสดงรายชื่อ"></div>
 <button id="mute" title="เปิด/ปิดเสียง">🔊</button>
 <button id="go">หมุนเลย 🪷</button>
 <div id="toast"></div>
 <div id="win"><div><small>🪷 ผู้ถูกเลือกคือ 🪷</small><strong id="winner"></strong></div></div>
</div>

const COL=['#f8d7e0','#d5ebdc','#dce5f8','#fde3cc','#e4d6f1','#faf0cc'],R=196;

const names=()=>[...document.querySelectorAll('.row input')].map(i=>i.value.trim()).filter(Boolean);
function draw(){
 const nm=names(),items=nm.length?nm:Array(8).fill(''),n=items.length,s=360/n,rad=Math.PI/180;let h='';
 items.forEach((t,i)=>{
  const c=COL[i%COL.length],a0=(i*s-90)*rad,a1=((i+1)*s-90)*rad;

 inp.addEventListener('input',draw);
 inp.addEventListener('keydown',e=>{
  if(e.key==='Enter'){e.preventDefault();
   const nx=r.nextElementSibling;
   if(nx)nx.lastChild.focus();else if(inp.value.trim()){addRow(r)}
   list.scrollTop=list.scrollHeight}
  else if(e.key==='Backspace'&&!inp.value&&list.children.length>1){e.preventDefault();
   const pv=r.previousElementSibling||r.nextElementSibling;r.remove();renum();pv.lastChild.focus();draw()}
 });
 inp.focus({preventScroll:true});list.scrollTop=list.scrollHeight;return r;
}
addRow();draw();
/* ---- เสียง (สร้างด้วย Web Audio ไม่ต้องใช้ไฟล์เสียง) ---- */
let AC,muted=false;
function ac(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}
function tone(f,t0,dur,vol,type='sine',f2){if(muted)return;const a=ac(),o=a.createOscillator(),g=a.createGain();
 o.type=type;o.frequency.setValueAtTime(f,a.currentTime+t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,a.currentTime+t0+dur);
 g.gain.setValueAtTime(0.0001,a.currentTime+t0);g.gain.exponentialRampToValueAtTime(vol,a.currentTime+t0+.01);g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+t0+dur);
 o.connect(g).connect(a.destination);o.start(a.currentTime+t0);o.stop(a.currentTime+t0+dur+.05)}
const tick=()=>tone(1100+Math.random()*250,0,.05,.12,'triangle',700);
const whoosh=()=>{tone(220,0,.9,.1,'sawtooth',900);tone(330,0,.9,.06,'triangle',1300)};
function chime(){[523.25,659.25,783.99,1046.5,1318.5].forEach((f,i)=>{tone(f,i*.11,1.2,.16,'sine');tone(f*2,i*.11,.6,.04,'triangle')});
 tone(1568,.65,1.4,.1,'sine');tone(2093,.78,1.3,.07,'sine')}
$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'🔇':'🔊';if(!muted){ac();tick()}};
/* จังหวะ "ติ๊ก" ทุกครั้งที่ขอบช่องผ่านตัวชี้ */
function ticker(s){let last=null,cum=0,k0=null;
 (function f(){if(!busy)return;const m=new DOMMatrix(getComputedStyle($('disc')).transform),a=Math.atan2(m.b,m.a)*180/Math.PI;
  if(last!==null){let d=a-last;d=((d+540)%360)-180;cum+=d}last=a;
  const k=Math.floor(cum/s);if(k0===null)k0=k;if(k!==k0){tick();k0=k}requestAnimationFrame(f)})()}
/* ---- ซ่อน/แสดงรายชื่อด้วยไอคอนตา ---- */
$('eye').onclick=()=>{const h=document.body.classList.toggle('hide');list.inert=h;
 if(h&&document.activeElement)document.activeElement.blur();toast(h?'ซ่อนรายชื่อแล้ว 🙈 กดที่รูปตาเพื่อเปิดอีกครั้ง':'แสดงรายชื่อแล้ว 👁️')};
/* ---- หมุน ---- */
let rot=0,busy=false,tt;
function toast(m){const t=$('toast');t.textContent=m;t.style.opacity=1;clearTimeout(tt);tt=setTimeout(()=>t.style.opacity=0,2200)}
function spin(){
 if(busy)return;const nm=names(),n=nm.length;
 if(n<2){toast('พิมพ์ชื่ออย่างน้อย 2 รายชื่อก่อนนะ 🪷');return}
 const s=360/n,w=Math.floor(Math.random()*n),target=-(w+.5)*s+(Math.random()-.5)*s*.7;
 const cur=((rot%360)+360)%360,delta=(((target-cur)%360)+360)%360;
 rot+=360*6+delta;$('disc').style.transform=`rotate(${rot}deg)`;busy=true;$('go').disabled=true;ac();whoosh();ticker(s);
 setTimeout(()=>{busy=false;$('go').disabled=false;$('winner').textContent=nm[w];$('win').style.display='flex';chime()},5700);
}
$('go').onclick=spin;$('hit').onclick=spin;$('win').onclick=()=>$('win').style.display='none';
</script></body></html>
